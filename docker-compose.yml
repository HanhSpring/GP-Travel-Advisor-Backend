services:
  postgres:
    image: postgres:15
    container_name: travel-advisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d travel_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - travel-network

volumes:
  postgres_data:
    driver: local

networks:
  travel-network:
    driver: bridge
