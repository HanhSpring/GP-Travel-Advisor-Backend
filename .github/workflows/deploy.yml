name: CD - Backend Deploy

on:
  push:
    branches:
      - develop

env:
  REGISTRY: registry.digitalocean.com/graduation
  IMAGE_NAME: backend-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./api-service
        run: npm install

      - name: Build NestJS app
        working-directory: ./api-service
        run: npm run build

      - name: Login DO Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build Docker Image
        working-directory: ./api-service
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/app
            echo "${{ secrets.DO_REGISTRY_TOKEN }}" | docker login registry.digitalocean.com -u "${{ secrets.DO_REGISTRY_TOKEN }}" --password-stdin
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            $DC pull backend-api
            $DC rm -f backend-api
            $DC up -d --no-deps backend-api
            $DC ps
